<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1"><style>:root{color-scheme:light}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>

<title>Finn's Christmas List</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=Source+Serif+4:ital,opsz,wght@0,8..60,400..600;1,8..60,400..600&family=JetBrains+Mono:wght@400;500;600&display=swap');

  /* Deliberately light-only: a classic red & green Christmas palette. */
  :root{
    --bg:#fbfaf5;
    --paper:#ffffff;
    --paper-2:#f3f6f1;
    --ink:#182420;
    --ink-soft:#57685e;
    --pine:#0f5c34;
    --pine-2:#177a44;
    --pine-ink:#f4faf3;
    --cranberry:#c31432;
    --cranberry-ink:#ffffff;
    --gold:#b8863a;
    --gold-soft:#f2e6cd;
    --line:#e2e4d9;
    --shadow: 0 1px 2px rgba(20,30,20,.06), 0 8px 24px -12px rgba(20,30,20,.18);
    --radius: 14px;
  }

  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--ink);
    font-family:"Source Serif 4", Georgia, "Times New Roman", serif;
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3,.display{
    font-family:"Bricolage Grotesque", "Segoe UI", Arial, sans-serif;
    text-wrap:balance;
  }
  .mono{
    font-family:"JetBrains Mono", ui-monospace, Menlo, Consolas, monospace;
    font-variant-numeric:tabular-nums;
  }
  a{color:inherit;}
  button{font:inherit;}

  /* ---------- top hero ---------- */
  .hero{
    padding:64px 24px 40px;
    max-width:1080px;
    margin:0 auto;
  }
  .hero-eyebrow{
    display:inline-flex;
    align-items:center;
    gap:8px;
    font-family:"JetBrains Mono", monospace;
    font-size:.72rem;
    letter-spacing:.14em;
    text-transform:uppercase;
    color:var(--cranberry);
    margin-bottom:14px;
  }
  .hero-eyebrow svg{width:14px;height:14px;flex:none;}
  h1.title{
    font-size:clamp(2.2rem, 5vw, 3.6rem);
    line-height:1.02;
    margin:0 0 14px;
    font-weight:800;
    color:var(--ink);
  }
  .hero p.sub{
    max-width:56ch;
    font-size:1.08rem;
    color:var(--ink-soft);
    margin:0 0 30px;
    line-height:1.55;
  }
  /* ---------- sticky nav ---------- */
  nav.jump{
    position:sticky;
    top:0;
    z-index:20;
    background:color-mix(in srgb, var(--bg) 88%, transparent);
    backdrop-filter:blur(10px);
    border-bottom:1px solid var(--line);
  }
  .jump-inner{
    max-width:1080px;
    margin:0 auto;
    padding:12px 24px;
    display:flex;
    gap:8px;
    overflow-x:auto;
    scrollbar-width:none;
  }
  .jump-inner::-webkit-scrollbar{display:none;}
  .jump-pill{
    flex:none;
    display:flex;
    align-items:center;
    gap:8px;
    padding:8px 16px;
    border-radius:999px;
    border:1px solid var(--line);
    background:var(--paper);
    color:var(--ink-soft);
    font-family:"Bricolage Grotesque", sans-serif;
    font-weight:600;
    font-size:.88rem;
    cursor:pointer;
    text-decoration:none;
    transition:background .15s, color .15s, border-color .15s;
  }
  .jump-pill .count{
    font-family:"JetBrains Mono", monospace;
    font-size:.72rem;
    background:var(--gold-soft);
    color:var(--gold);
    border-radius:999px;
    padding:2px 7px;
  }
  .jump-pill.active,.jump-pill:hover{
    background:var(--pine);
    color:var(--pine-ink);
    border-color:var(--pine);
  }
  .jump-pill.active .count,.jump-pill:hover .count{
    background:rgba(255,255,255,.16);
    color:var(--pine-ink);
  }
  .jump-pill:focus-visible{outline:2px solid var(--cranberry); outline-offset:2px;}

  /* ---------- recipient section ---------- */
  section.recipient{scroll-margin-top:64px;}
  .band{
    background:var(--pine);
    color:var(--pine-ink);
    padding:38px 24px;
  }
  .band-inner{
    max-width:1080px;
    margin:0 auto;
  }
  .band h2{
    font-size:clamp(1.7rem, 3.4vw, 2.4rem);
    margin:0 0 6px;
    font-weight:700;
  }
  .band .note{
    color:color-mix(in srgb, var(--pine-ink) 72%, transparent);
    font-size:.98rem;
    margin:0;
    max-width:48ch;
  }

  .recipient-body{
    max-width:1080px;
    margin:0 auto;
    padding:8px 24px 56px;
  }

  .category{margin-top:38px;}
  .category-label{
    font-family:"JetBrains Mono", monospace;
    font-size:.76rem;
    letter-spacing:.12em;
    text-transform:uppercase;
    color:var(--gold);
    border-bottom:1px solid var(--line);
    padding-bottom:8px;
    margin-bottom:18px;
  }
  .bonus-flag{
    display:inline-block;
    margin-left:10px;
    font-size:.68rem;
    letter-spacing:.08em;
    background:var(--cranberry);
    color:var(--cranberry-ink);
    padding:2px 8px;
    border-radius:999px;
    vertical-align:middle;
    text-transform:uppercase;
  }

  .grid{
    display:grid;
    grid-template-columns:repeat(auto-fill, minmax(230px, 1fr));
    gap:20px;
  }

  /* ---------- item card ---------- */
  .card{
    position:relative;
    background:var(--paper);
    border:1px solid var(--line);
    border-radius:var(--radius);
    box-shadow:var(--shadow);
    display:flex;
    flex-direction:column;
    overflow:hidden;
    opacity:0;
    transform:translateY(10px);
    transition:opacity .5s ease, transform .5s ease;
  }
  .card.in{opacity:1; transform:translateY(0);}
  @media (prefers-reduced-motion:reduce){
    .card{transition:none; opacity:1; transform:none;}
  }
  .card.claimed{
    background:var(--paper-2);
  }
  .photo-wrap{
    position:relative;
    height:220px;
    background:var(--paper-2);
    display:flex;
    align-items:center;
    justify-content:center;
    padding:14px;
    border-bottom:1px solid var(--line);
  }
  .photo-wrap img{
    max-width:100%;
    max-height:100%;
    object-fit:contain;
    filter:drop-shadow(0 6px 10px rgba(20,30,20,.14));
  }

  /* ---------- store label ---------- */
  .store{
    position:absolute; top:10px; left:10px; z-index:5;
    font-family:"JetBrains Mono", monospace; font-size:.66rem; font-weight:600;
    letter-spacing:.08em; text-transform:uppercase;
    background:var(--paper); color:var(--ink-soft);
    border:1px solid var(--line); border-radius:999px; padding:3px 9px;
  }
  .store.amazon{background:#fff7ea; color:#a35400; border-color:#f1d6ae;}
  .store.zoki{background:#fff2f8; color:#a63a6f; border-color:#f0cbdd;}

  /* ---------- wrapped-gift overlay ---------- */
  .wrap{
    position:absolute; inset:0; z-index:3;
    display:flex; align-items:center; justify-content:center;
    background:
      linear-gradient(90deg, transparent calc(50% - 10px), var(--gold) calc(50% - 10px), #dcb062 50%, var(--gold) calc(50% + 10px), transparent calc(50% + 10px)),
      linear-gradient(0deg, transparent calc(50% - 10px), var(--gold) calc(50% - 10px), #dcb062 50%, var(--gold) calc(50% + 10px), transparent calc(50% + 10px)),
      repeating-linear-gradient(45deg, #c31432 0 14px, #ad0f2a 14px 28px);
    opacity:0; transform:scale(.7);
    transition:opacity .3s ease, transform .45s cubic-bezier(.2,1.5,.4,1);
    pointer-events:none;
  }
  .card.claimed .wrap{opacity:1; transform:scale(1);}
  .wrap svg{width:84px; height:64px; margin-top:-8px; filter:drop-shadow(0 3px 4px rgba(0,0,0,.28));}
  .wrapped-label{
    position:absolute; bottom:12px; left:50%; transform:translateX(-50%);
    background:var(--paper); color:var(--cranberry);
    font-family:"Bricolage Grotesque", sans-serif; font-weight:700; font-size:.78rem;
    letter-spacing:.06em; text-transform:uppercase;
    padding:3px 10px; border-radius:999px; box-shadow:0 2px 6px rgba(0,0,0,.2);
  }
  @media (prefers-reduced-motion:reduce){ .wrap{transition:none;} }

  /* ---------- string lights ---------- */
  .lights{height:58px; overflow:hidden; margin-bottom:-20px;}
  .lights svg{display:block; width:100%; height:58px;}
  .bulb{animation:twinkle 2.4s ease-in-out infinite;}
  @keyframes twinkle{0%,100%{opacity:1;} 50%{opacity:.35;}}
  @media (prefers-reduced-motion:reduce){ .bulb,.tree .orn{animation:none;} }

  /* ---------- hero extras ---------- */
  .hero-grid{display:flex; align-items:flex-end; justify-content:space-between; gap:24px;}
  .hero .tree{width:170px; height:auto; flex:none; margin-bottom:-12px;}
  .tree .orn{animation:twinkle 3s ease-in-out infinite;}
  @media (max-width:640px){ .hero .tree{display:none;} }
  .countdown{display:flex; align-items:baseline; gap:10px; margin:6px 0 20px;}
  .cd-num{font-family:"JetBrains Mono", monospace; font-weight:600; font-size:2.4rem; color:var(--cranberry); line-height:1;}
  .cd-label{font-size:1.05rem; color:var(--ink-soft);}
  .hero-tools{display:flex; flex-wrap:wrap; align-items:center; gap:8px;}
  .toggle{
    display:inline-flex; align-items:center; gap:6px;
    padding:6px 12px; border-radius:999px;
    border:1px solid var(--line); background:var(--paper); color:var(--ink-soft);
    font-family:"Bricolage Grotesque", sans-serif; font-weight:600; font-size:.8rem; cursor:pointer;
  }
  .toggle svg{width:14px; height:14px;}
  .toggle[aria-pressed="true"]{background:var(--pine); border-color:var(--pine); color:var(--pine-ink);}
  .toggle:focus-visible{outline:2px solid var(--cranberry); outline-offset:2px;}
  .sync{font-family:"JetBrains Mono", monospace; font-size:.72rem; color:var(--ink-soft); display:inline-flex; align-items:center; gap:6px;}
  .sync::before{content:""; width:7px; height:7px; border-radius:50%; background:#b9bfb4;}
  .sync.live::before{background:var(--pine-2);}
  .sync.error::before{background:var(--cranberry);}

  #snow,#confetti{position:fixed; inset:0; width:100%; height:100%; pointer-events:none;}
  #snow{z-index:15;}
  #confetti{z-index:40;}

  .tag{
    position:absolute;
    top:10px;
    right:-6px;
    z-index:5;
    background:var(--cranberry);
    color:var(--cranberry-ink);
    font-family:"JetBrains Mono", monospace;
    font-weight:600;
    font-size:.92rem;
    padding:5px 12px 5px 16px;
    border-radius:3px 8px 8px 3px;
    box-shadow:0 3px 8px rgba(0,0,0,.22);
    transform:rotate(4deg);
  }
  .tag::before{
    content:"";
    position:absolute;
    left:5px;
    top:50%;
    width:5px;
    height:5px;
    margin-top:-2.5px;
    background:var(--paper);
    border-radius:50%;
    box-shadow:0 0 0 1px var(--pine);
  }

  .card-body{
    padding:16px 18px 18px;
    display:flex;
    flex-direction:column;
    gap:10px;
    flex:1;
  }
  .card-body h3{
    font-size:1.05rem;
    line-height:1.28;
    margin:0;
    font-weight:600;
    color:var(--ink);
  }
  .card-body h3 a{
    text-decoration:none;
    color:var(--ink);
    background-image:linear-gradient(var(--pine-2), var(--pine-2));
    background-size:0% 1px;
    background-repeat:no-repeat;
    background-position:0 100%;
    transition:background-size .15s, color .15s;
  }
  .card-body h3 a:hover,.card-body h3 a:focus-visible{
    color:var(--pine-2);
    background-size:100% 1px;
  }
  .card-body h3 a svg{
    width:.7em;
    height:.7em;
    margin-left:3px;
    vertical-align:2px;
    opacity:.6;
  }
  .num{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    min-width:1.6em;
    height:1.6em;
    padding:0 .35em;
    margin-right:8px;
    border-radius:999px;
    background:var(--pine);
    color:var(--pine-ink);
    font-size:.78rem;
    font-weight:600;
    vertical-align:2px;
  }
  .reqs{
    display:flex;
    flex-wrap:wrap;
    gap:6px;
  }
  .reqs span{
    font-size:.74rem;
    font-family:"JetBrains Mono", monospace;
    color:var(--ink-soft);
    border:1px solid var(--line);
    border-radius:6px;
    padding:2px 7px;
  }
  .got-btn{
    margin-top:auto;
    align-self:flex-start;
    display:inline-flex;
    align-items:center;
    gap:7px;
    padding:8px 14px;
    border-radius:999px;
    border:1px solid var(--pine-2);
    background:transparent;
    color:var(--pine-2);
    font-weight:600;
    font-size:.82rem;
    cursor:pointer;
    transition:background .15s,color .15s;
  }
  .got-btn:hover{background:var(--pine-2); color:var(--pine-ink);}
  .got-btn svg{width:13px;height:13px;flex:none;}
  .got-btn.on{
    background:var(--cranberry);
    border-color:var(--cranberry);
    color:var(--cranberry-ink);
  }
  .got-btn:focus-visible{outline:2px solid var(--cranberry); outline-offset:2px;}

  footer{
    text-align:center;
    padding:50px 24px 70px;
    color:var(--ink-soft);
    font-family:"JetBrains Mono", monospace;
    font-size:.8rem;
    letter-spacing:.04em;
  }
</style>

<nav class="jump" id="jumpNav">
  <div class="jump-inner" id="jumpInner"></div>
</nav>

<canvas id="snow" aria-hidden="true"></canvas>
<canvas id="confetti" aria-hidden="true"></canvas>
<div class="lights" id="lights" aria-hidden="true"></div>

<div class="hero">
  <div class="hero-grid">
    <div>
      <div class="hero-eyebrow">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2v20M2 12h20M6 6l12 12M18 6L6 18"/></svg>
        2026 wish list
      </div>
      <h1 class="title">Finn's Christmas List</h1>
      <div class="countdown" id="countdown"></div>
      <div class="hero-tools">
        <button class="toggle" id="snowToggle" aria-pressed="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 2v20M3.3 7l17.4 10M3.3 17L20.7 7M9 3.5l3 2.5 3-2.5M9 20.5l3-2.5 3 2.5"/></svg>
          Snow
        </button>
        <span class="sync" id="sync"></span>
      </div>
    </div>
    <svg class="tree" viewBox="0 0 200 250" aria-hidden="true">
      <polygon points="100,6 106,22 123,22 109,32 114,48 100,38 86,48 91,32 77,22 94,22" fill="#e0b04f" stroke="#b8863a" stroke-width="1.5" stroke-linejoin="round"/>

      <path d="M100 40 L148 108 L126 108 L168 168 L140 168 L184 228 L100 228 Z" fill="#177a44" opacity=".55"/>
      <path d="M70 102 Q100 120 132 100" stroke="#e0b04f" stroke-width="3" fill="none" stroke-dasharray="1 7" stroke-linecap="round"/>
      <path d="M52 162 Q100 186 150 160" stroke="#e0b04f" stroke-width="3" fill="none" stroke-dasharray="1 7" stroke-linecap="round"/>
      <path d="M36 220 Q100 246 166 218" stroke="#e0b04f" stroke-width="3" fill="none" stroke-dasharray="1 7" stroke-linecap="round"/>
      <circle class="orn" cx="92" cy="80" r="6" fill="#c31432"/>
      <circle class="orn" cx="116" cy="92" r="5" fill="#e0b04f" style="animation-delay:.6s"/>

      <rect x="90" y="228" width="20" height="14" rx="2" fill="#7a4b2a"/>

      <rect x="46" y="228" width="6" height="20" fill="#c31432"/>
    </svg>
  </div>
</div>

<main id="main"></main>

function wireGotButtons(){
  document.querySelectorAll('.got-btn').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const id = btn.dataset.id;
      const isOn = !got[id];
      if(isOn) got[id] = true; else delete got[id];
      paintCard(id);
      if(isOn){
        const r = btn.getBoundingClientRect();
        confetti(r.left + r.width/2, r.top + r.height/2);
      }
      if(sharedRef){
        sharedRef.child(id).set(isOn ? true : null).catch(()=>setSync("error"));
      }else{
        saveGot(got);
      }
    });
  });
}

/* ---------- shared marks (Firebase Realtime Database) ---------- */
function setSync(state){
  const el = document.getElementById('sync');
  el.className = "sync " + state;
  el.textContent = state === "live" ? "Shared: everyone sees marks"
    : state === "error" ? "Offline: marks save on this device"
    : "Marks save on this device";
}

function loadScript(src){
  return new Promise((res, rej)=>{
    const s = document.createElement('script');
    s.src = src; s.onload = res; s.onerror = rej;
    document.head.appendChild(s);
  });
}

async function connectShared(){
  setSync("local");
  if(!FIREBASE_CONFIG) return;
  try{
    await loadScript(FIREBASE_CDN + "firebase-app-compat.js");
    await loadScript(FIREBASE_CDN + "firebase-database-compat.js");
    firebase.initializeApp(FIREBASE_CONFIG);
    sharedRef = firebase.database().ref("got");
    sharedRef.on("value", snap=>{
      got = snap.val() || {};
      paintAll();
      setSync("live");
    }, ()=>{ sharedRef = null; setSync("error"); });
  }catch(e){
    sharedRef = null;
    setSync("error");
  }
}

/* ---------- prefs ---------- */
function getPref(k, fallback){
  try{ const v = localStorage.getItem(k); return v === null ? fallback : v === "1"; }catch(e){ return fallback; }
}
function setPref(k, v){
  try{ localStorage.setItem(k, v ? "1" : "0"); }catch(e){}
}

/* ---------- countdown ---------- */
function updateCountdown(){
  const el = document.getElementById('countdown');
  const now = new Date();
  const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  let xmas = new Date(now.getFullYear(), 11, 25);
  if(today > xmas) xmas = new Date(now.getFullYear() + 1, 11, 25);
  const days = Math.round((xmas - today) / 86400000);
  el.innerHTML = days === 0
    ? `<span class="cd-num">Merry Christmas!</span>`
    : `<span class="cd-num">${days}</span><span class="cd-label">${days === 1 ? "day" : "days"} until Christmas</span>`;
}

/* ---------- string lights ---------- */
function drawLights(){
  const box = document.getElementById('lights');
  const w = box.clientWidth || window.innerWidth;
  const span = 140, sag = 18, top = 6;
  const hooks = Math.max(2, Math.round(w / span) + 1);
  const step = w / (hooks - 1);
  const colors = ["#c31432", "#e0b04f", "#177a44", "#2f6fb5"];
  let wire = `M0 ${top}`;
  let bulbs = "";
  let n = 0;
  for(let i = 0; i < hooks - 1; i++){
    const x0 = i * step, x1 = x0 + step, cx = x0 + step/2, cy = top + sag*2;
    wire += ` Q${cx} ${cy} ${x1} ${top}`;
    for(const t of [0.2, 0.5, 0.8]){
      const x = (1-t)*(1-t)*x0 + 2*(1-t)*t*cx + t*t*x1;
      const y = (1-t)*(1-t)*top + 2*(1-t)*t*cy + t*t*top;
      const c = colors[n % colors.length];
      const delay = ((n * 0.37) % 2.4).toFixed(2);
      bulbs += `<g transform="translate(${x.toFixed(1)} ${y.toFixed(1)})"><rect x="-3" y="0" width="6" height="5" rx="1" fill="#3b4a40"/><ellipse class="bulb" style="animation-delay:${delay}s" cx="0" cy="13" rx="5.5" ry="8.5" fill="${c}"/></g>`;
      n++;
    }
  }
  box.innerHTML = `<svg viewBox="0 0 ${w} 58"><path d="${wire}" fill="none" stroke="#2f3b33" stroke-width="2"/>${bulbs}</svg>`;
}

/* ---------- snow ---------- */
function initSnow(){
  const c = document.getElementById('snow');
  const ctx = c.getContext('2d');
  const btn = document.getElementById('snowToggle');
  let flakes = [], w = 0, h = 0, raf = null;
  let on = getPref("xmas26_snow", !reduceMotion);

  function make(anywhere){
    return {x:Math.random()*w, y:anywhere ? Math.random()*h : -6, r:1.2 + Math.random()*2.6,
            s:.35 + Math.random()*.9, d:Math.random()*Math.PI*2, o:.55 + Math.random()*.4};
  }
  function size(){
    const dpr = window.devicePixelRatio || 1;
    w = window.innerWidth; h = window.innerHeight;
    c.width = w * dpr; c.height = h * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    const count = Math.round(Math.min(120, w * h / 12000));
    while(flakes.length < count) flakes.push(make(true));
    flakes.length = count;
  }
  function tick(){
    ctx.clearRect(0, 0, w, h);
    for(const f of flakes){
      f.y += f.s; f.d += .012; f.x += Math.sin(f.d) * .45;
      if(f.y > h + 6) Object.assign(f, make(false));
      ctx.beginPath();
      ctx.arc(f.x, f.y, f.r, 0, Math.PI*2);
      ctx.fillStyle = `rgba(255,255,255,${f.o})`;
      ctx.fill();
      ctx.strokeStyle = `rgba(110,140,170,${f.o * .45})`;
      ctx.lineWidth = .8;
      ctx.stroke();
    }
    raf = requestAnimationFrame(tick);
  }
  function apply(){
    btn.setAttribute('aria-pressed', on);
    if(on && !raf){ size(); tick(); }
    if(!on && raf){ cancelAnimationFrame(raf); raf = null; ctx.clearRect(0, 0, w, h); }
  }
  btn.addEventListener('click', ()=>{ on = !on; setPref("xmas26_snow", on); apply(); });
  window.addEventListener('resize', ()=>{ if(on) size(); });
  apply();
}

/* ---------- confetti ---------- */
function confetti(x, y){
  if(reduceMotion) return;
  const c = document.getElementById('confetti');
  const ctx = c.getContext('2d');
  const dpr = window.devicePixelRatio || 1;
  const w = window.innerWidth, h = window.innerHeight;
  c.width = w * dpr; c.height = h * dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  const colors = ["#c31432", "#e0b04f", "#177a44", "#ffffff", "#2f6fb5"];
  const bits = Array.from({length:80}, ()=>({
    x, y, vx:(Math.random()-.5)*10, vy:-3 - Math.random()*9,
    s:5 + Math.random()*5, rot:Math.random()*6, vr:(Math.random()-.5)*.4,
    c:colors[Math.floor(Math.random()*colors.length)]
  }));
  const start = performance.now();
  function frame(now){
    ctx.clearRect(0, 0, w, h);
    for(const b of bits){
      b.vy += .28; b.vx *= .985; b.x += b.vx; b.y += b.vy; b.rot += b.vr;
      ctx.save();
      ctx.translate(b.x, b.y); ctx.rotate(b.rot);
      ctx.fillStyle = b.c;
      ctx.fillRect(-b.s/2, -b.s/4, b.s, b.s/2);
      ctx.restore();
    }
    if(now - start < 2200) requestAnimationFrame(frame);
    else ctx.clearRect(0, 0, w, h);
  }
  requestAnimationFrame(frame);
}

function wireScrollSpy(){
  const pills = Array.from(document.querySelectorAll('.jump-pill'));
  const sections = RECIPIENTS.map(r=>document.getElementById(r.id)).filter(Boolean);
  const refY = 130; // just below the sticky nav bar

  function setActive(id){
    pills.forEach(p=>p.classList.toggle('active', p.dataset.id===id));
  }

  function currentSectionId(){
    let currentId = sections[0].id;
    for(const s of sections){
      if(s.getBoundingClientRect().top <= refY) currentId = s.id;
    }
    return currentId;
  }

  let ticking = false;
  function onScroll(){
    if(ticking) return;
    ticking = true;
    requestAnimationFrame(()=>{
      setActive(currentSectionId());
      ticking = false;
    });
  }

  pills.forEach(p=>{
    p.addEventListener('click', ()=> setActive(p.dataset.id));
  });

  window.addEventListener('scroll', onScroll, {passive:true});
  onScroll();
}

function wireCardReveal(){
  const cards = document.querySelectorAll('.card');
  const io = new IntersectionObserver((entries, obs)=>{
    entries.forEach(e=>{
      if(e.isIntersecting){
        e.target.classList.add('in');
        obs.unobserve(e.target);
      }
    });
  }, {threshold:.1});
  cards.forEach(c=>io.observe(c));
}
